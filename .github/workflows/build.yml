name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/homeshopping/app app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cp index.html app/src/main/assets/index.html
          cp MainActivity.java app/src/main/java/com/homeshopping/app/
          cp AndroidManifest.xml app/src/main/
          cp app-build.gradle app/build.gradle
          cp strings.xml colors.xml styles.xml app/src/main/res/values/
          cp ic_fg.xml app/src/main/res/drawable/
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/

      - name: Bundle SheetJS locally
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o app/src/main/assets/xlsx.full.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' app/src/main/assets/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HomeShopping-APK
          path: app/build/outputs/apk/debug/app-debug.apk
