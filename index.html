<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1c2a22;--mut:#6b7a70;--pri:#1f6f54;--acc:#e8a33d;--line:#dbe3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
button,input{font:inherit;color:inherit}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px;font-family:system-ui,sans-serif}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:14px}
.stat b{display:block;font-size:30px;font-family:Georgia,serif;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
h1{margin:0;font-size:26px;letter-spacing:.3px;color:#fff}
.burger{background:none;border:0;padding:8px;cursor:pointer;display:grid;gap:5px}
.burger i{display:block;width:24px;height:3px;background:#fff;border-radius:2px}
.dots{display:flex;justify-content:center;gap:56px;padding:6px 0 10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer;position:relative}
.dot:before{content:"";position:absolute;inset:-14px}
main{flex:1;overflow-y:auto;padding:8px 18px 18px}
.btnrow{display:grid;gap:12px;margin-top:22px}
.big{padding:16px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-size:18px;cursor:pointer}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--pri)}
.pop{animation:pop .25s ease}@keyframes pop{from{transform:scale(.9);opacity:0}}
.hint{color:var(--mut);font-size:14px;text-align:center;margin-top:18px;font-family:system-ui,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-family:system-ui,sans-serif}
.item .em{font-size:38px;text-align:center}.item b{display:block;margin-top:6px}
.item span{color:var(--mut);font-size:14px}
nav[hidden]{display:none}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:12px 0;background:none;border:0;font-family:system-ui,sans-serif;font-size:13px;cursor:pointer;color:var(--ink)}
nav button.on{color:var(--pri);font-weight:700}nav button:disabled{opacity:.35;cursor:not-allowed}
nav .ic{display:block;font-size:20px}
.form{display:grid;gap:12px;margin-top:10px;font-family:system-ui,sans-serif}
.sel{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.form input,.form textarea{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.msg{font-family:system-ui,sans-serif;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.err{color:#c0392b}
.drawer{position:absolute;top:0;right:0;bottom:0;width:78%;background:var(--card);box-shadow:-8px 0 24px rgba(0,0,0,.25);padding:24px 20px;transform:translateX(100%);transition:transform .25s;z-index:5;font-family:system-ui,sans-serif}
.drawer.open{transform:none}.drawer h3{margin:0 0 14px;font-family:Georgia,serif}
.drawer p{padding:12px 0;margin:0;border-bottom:1px solid var(--line)}
.link{background:none;border:0;color:var(--pri);cursor:pointer;padding:6px 0;font-family:system-ui,sans-serif}
h2{margin:6px 0 4px;font-size:22px}
.tw{overflow-x:auto;font-family:system-ui,sans-serif;margin-top:16px}table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}th,td{border:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}th{background:var(--pri);color:#fff}
td button{border:0;border-radius:8px;padding:5px 9px;margin-right:4px;cursor:pointer;background:var(--pri);color:#fff}td button.d{background:#c0392b}
.pic{width:110px;height:110px;border-radius:50%;border:2px dashed var(--pri);display:grid;place-items:center;font-size:34px;margin:0 auto;cursor:pointer;background-size:cover;background-position:center}.pic.has{color:transparent;border-style:solid}
.stat.tap{cursor:pointer;border-left-color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:9;padding:20px}.dlg{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:system-ui,sans-serif}.dlg p{grid-column:1/3;margin:0 0 6px}.d2{background:#c0392b}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;font-family:system-ui,sans-serif}
.ipic{width:64px;height:64px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none}
.mid{flex:1;min-width:0;display:grid;gap:2px}.mid span{color:var(--mut);font-size:13px}
.rt{text-align:right;display:grid;gap:8px;justify-items:end}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:22px;cursor:pointer;line-height:1}.plus.d{background:#c0392b;font-size:16px}
.dlg input{grid-column:1/3;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.step{display:flex;align-items:center;gap:6px}.step button{width:28px;height:28px;border-radius:50%;border:0;background:var(--pri);color:#fff;cursor:pointer;padding:0;margin:0;font-size:16px}.step b{min-width:20px;text-align:center}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}.cnt{border:2px solid var(--pri);border-radius:12px;padding:6px 12px;text-align:center;font-family:system-ui,sans-serif;line-height:1.1}.cnt b{display:block;font-size:20px;color:var(--pri)}.cnt span{font-size:11px;color:var(--mut)}
.sum{display:grid;gap:10px;margin-top:14px;font-family:system-ui,sans-serif}.sum label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}.sum input{width:110px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:right}
.gr{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}.gt{background:var(--pri);color:#fff;font-size:18px}
.lg{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;cursor:pointer}.lg[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-family:system-ui,sans-serif;font-size:14px;z-index:20}
.ed{margin-left:10px;font-size:13px;padding:0;text-decoration:underline}
.mi{display:block;width:100%;text-align:left;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;font-size:16px;cursor:pointer}.mi:disabled{opacity:.35;cursor:not-allowed}
.item.fold{cursor:pointer;text-align:center;color:inherit;font-size:14px}
.dr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-family:system-ui,sans-serif}.dr2 label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.dr2 input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}.dr2 .big{grid-column:1/3;padding:12px}
.th{display:block;margin-top:4px;font-size:12px;padding:3px;border-radius:6px;border:0;min-width:90px;max-width:150px;background:var(--bg);color:var(--ink)}
.upl{display:block;text-align:center;cursor:pointer;font-family:system-ui,sans-serif;padding:14px;border-radius:14px}
.fxc .pic{margin:0 auto}.fx{display:flex;gap:8px;align-items:center}.fxc{flex:1;display:grid;gap:12px;min-width:0}.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut);white-space:nowrap;font-family:system-ui,sans-serif;cursor:pointer}.chk input{width:18px;height:18px;padding:0;margin:0}
.dsc{background:#c0392b;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}.old{font-size:12px;color:var(--mut)}.free{color:#c0392b!important;font-weight:700}.blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:.2}}
.tabs{display:flex;gap:6px;margin:8px 0 12px;font-family:system-ui,sans-serif}.tab{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px}.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
tr.off td:not(:last-child){opacity:.4}td input[type=checkbox]{width:18px;height:18px;margin:0}
.btnline{display:flex;gap:10px;margin-bottom:6px}.btnline>*{flex:1;margin:0;padding:12px 6px;font-size:15px;text-align:center}
.heart{background:none;border:0;padding:0 2px;cursor:pointer;font-size:16px;vertical-align:middle;line-height:1}.heart.sm{font-size:13px}
</style></head><body>

S.items=[{id:1,name:'Apples',shop:'Fresh Mart',district:'Faisalabad',city:'Faisalabad',price:320,status:'Available',cat:'Fruits',discId:1,em:'🍎',adm:'admin'},{id:2,name:'Milk',shop:'Fresh Mart',district:'Faisalabad',city:'Faisalabad',price:260,status:'Available',cat:'Dairy',freeId:1,em:'🥛',adm:'admin'},{id:3,name:'Rice',shop:'Al-Madina Store',district:'Jhang',city:'Jhang',price:450,status:'Available',cat:'Grains',em:'🍚',adm:'admin'}];S.iid=4;S.bill=[];S.customers=[];S.cid=1;S.cats=['Fruits','Dairy','Bakery','Grains','Groceries','Household'].map((n,i)=>({id:i+1,name:n}));S.catid=7;S.rates=[['Delivery charges per km',20],['Tax',50],['POS fee',10]].map((x,i)=>({id:i+1,name:x[0],val:x[1]}));S.rateid=4;S.favI=[];S.favS=[];S.favSel='items';S.shops=[{id:1,name:'Fresh Mart',adm:'admin',district:'Faisalabad',city:'Faisalabad'},{id:2,name:'Al-Madina Store',adm:'admin',district:'Jhang',city:'Jhang'}];S.shopid=3;S.cities=[{id:1,name:'Chak 204 RB',district:'Faisalabad',adm:'admin'}];S.cityid=2;S.dbill=[];S.inDemo=false;S.rt='rates';S.discs=[{id:1,name:'Eid Sale',val:10,itemId:1},{id:2,name:'Weekend Offer',val:20,itemId:3}];S.discid=3;S.frees=[{id:1,name:'Buy 1 Get 1 Free',itemId:2},{id:2,name:'Free 200ml Milk',itemId:3}];S.freeid=3;S.pays=['JazzCash','Easypaisa','Bank Transfer','Debit/Credit Card'].map((n,i)=>({id:i+1,name:n}));S.payid=5;S.fv={};S.statuses=['Available','Sold','Coming soon'].map((n,i)=>({id:i+1,name:n}));S.stid=4;S.editCat=null;S.editItem=null;S.addOpen=false;S.spPass='1234';S.sf='';S.from='';S.to='';S.q='';S.q2='';S.cf={};
S.sales=(()=>{const P=[['Faisalabad','Faisalabad','admin'],['Faisalabad','Jaranwala','admin'],['Lahore','Lahore','Fresh Corner'],['Jhang','Jhang','Al-Madina'],['Multan','Multan','Fresh Corner'],['Rawalpindi','Taxila','Al-Madina']],R=['Ali','Usman','Bilal'],C=['Akmal','Hamza','Sana','Bilal K','Ayesha'],ST=['Delivered','Delivered','Processing','Cancelled','Delivered'],I=[['Apples','Fruits'],['Milk','Dairy'],['Bread','Bakery'],['Rice','Grains'],['Cooking oil','Groceries'],['Soap','Household'],['Eggs','Dairy']],o=[];

$('dots').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;
 S.taps=S.taps.map((t,j)=>j==i?t+1:0);if(S.taps[i]>=9){S.shown[i]=true}render()};

function tabs(){
 if(S.role==='customer')return[['home','🏠','Home'],['fav','❤️','Favorite'],['bill','🧾','Bill',!S.customer],['notif','🔔','Alerts',!S.customer],['profile','👤','Profile']];
 if(S.role==='rider')return[['profile','👤','Profile'],['req','📦','Requests',!S.rider],['notif','🔔','Alerts',!S.rider]];
 if(S.role==='sadmin'&&S.superOK&&S.sv==='demo')return[['home','🏠','Home'],['bill','🧾','Bill'],['notif','🔔','Alerts']];

 if(!rows.length)return '<h2>Bill</h2><p class="msg">Bill abhi khali hai. Home se item par + dabayen.</p>';
 return `<h2>Bill</h2><div class="tw"><table><tr><th>Item</th><th>Shop</th><th>Qty</th><th>Price</th><th>Total</th></tr>${rows.map(r=>`<tr><td>${esc(r.i.name)}</td><td>${esc(r.i.shop)}</td><td><div class="step"><button onclick="chg(${r.i.id},-1)" aria-label="Less">−</button><b>${r.b.qty}</b><button onclick="chg(${r.i.id},1)" aria-label="More">+</button></div></td><td>${r.i.price}</td><td>${r.b.qty*r.i.price}</td></tr>`).join('')}</table></div>
 <div class="sum"><div class="gr"><span>Gross total</span><b>Rs ${gross}</b></div>
 ${tax>0?`<div class="gr"><span>Tax</span><b>Rs ${tax}</b></div>`:''}
 ${pos>0?`<div class="gr"><span>POS fee</span><b>Rs ${pos}</b></div>`:''}
 ${dsv>0?`<div class="gr"><span>Discount (offers)</span><b>− Rs ${dsv}</b></div>`:''}
 <label>Total distance (km)<input id="dk" type="number" min="0" step="0.1" value="${dist||''}" placeholder="0" oninput="S.dist=+this.value||0;upd()"></label>${auto===null?'<p class="hint" style="margin:0">Location coordinates na hon to distance khud likhein.</p>':''}
 <div class="gr"><span>Delivery charges<br><small id="dd" style="color:var(--mut)">${dist} km × Rs ${rate}/km</small></span><b id="dv">Rs ${dv}</b></div>
 <div class="gr gt"><span>Grand total</span><b id="gt">Rs ${Math.max(0,gross+tax+pos-dsv+dv)}</b></div></div>`}
const fixRate=k=>{const r=S.rates.find(x=>x.name.toLowerCase().includes(k)&&x.on!==false);return r?r.val:0};
function upd(){const d=S.dist!==null?S.dist:BG.a,dv=Math.round(d*BG.r);$('dv').textContent='Rs '+dv;$('dd').textContent=`${d} km × Rs ${BG.r}/km`;$('gt').textContent='Rs '+Math.max(0,BG.g+BG.t+BG.p-BG.d+dv)}
const ll=t=>{const m=String(t||'').match(/(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)/);return m?[+m[1],+m[2]]:null};
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function admOf(i){return S.admins.find(a=>a.u===i.adm)}
function rateOf(rows){const f=S.rates.find(x=>/delivery/i.test(x.name));if(f)return f.on!==false?f.val:0;const a=admOf(rows[0].i);return a&&a.rate!=null?a.rate:20}
function autoDist(rows){const c=ll(S.customer&&S.customer.pf.loc);if(!c)return null;let t=0;for(const u of new Set(rows.map(r=>r.i.adm))){const a=S.admins.find(x=>x.u===u),l=a&&a.pf&&ll(a.pf.loc);if(!l)return null;t+=hav(c,l)}return Math.round(t*10)/10}
function invView(){const pf=S.cur.pf;S.tmp={};if(fxv('a_pic',0,''))S.tmp.pic=fxv('a_pic',0,'');const own=S.items.filter(i=>i.adm===S.cur.u),cities=[...new Set([pf.city,...own.map(i=>i.city)])].sort(),sel=S.myCity!==null&&(S.myCity===''||cities.includes(S.myCity))?S.myCity:pf.city,mine=sel?own.filter(i=>i.city.trim().toLowerCase()===sel.trim().toLowerCase()):own;
 return `<h2>Add item</h2><div class="form">${fxw('a_pic',`<label class="pic ${fxv('a_pic',0,'')?'has':''}" id="pic" style="${fxv('a_pic',0,'')?`background-image:url(${fxv('a_pic',0,'')})`:''}">📷<input type="file" accept="image/*" hidden onchange="pickPic(this)"></label>`)}<p class="hint" style="margin:-6px 0 0">Item picture (lazmi)</p>${FXH}<input id="in" placeholder="Item name">${fxw('a_cat',catSel('icat',fxv('a_cat',0,'')))}${fxw('a_shop',`<input id="is" placeholder="Mart / shop name" value="${esc(fxv('a_shop',0,S.cur.shop||''))}">`)}${fxw('a_dc',dcSel('idd','ic',fxv('a_dc',0,pf.district),fxv('a_dc',1,pf.city)))}${fxw('a_p',`<input id="ip" placeholder="Price (Rs)" inputmode="decimal" value="${esc(fxv('a_p',0,''))}">`)}${fxw('a_st',stSel('ist',fxv('a_st',0,'')))}<button class="big" onclick="saveItem()">Save item</button></div><p class="msg err" id="pe" hidden></p><div class="hd" style="margin-top:20px"><h2>My items</h2><div class="cnt"><b>${mine.length}</b><span>Total items</span></div></div><select class="sel" style="width:100%;margin:6px 0 12px" aria-label="Filter by city" onchange="S.myCity=this.value;render()"><option value="">All cities</option>${cities.map(c=>`<option value="${esc(c)}" ${c===sel?'selected':''}>${esc(c)}</option>`).join('')}</select>${mine.map(i=>itemRow(i,false)).join('')||'<p class="msg">Is city mein abhi koi item nahi hai.</p>'}`}
function saveItem(){const g=id=>$(id).value.trim();const it={name:g('in'),shop:g('is'),district:g('idd'),city:g('ic'),price:parseFloat(g('ip')),status:g('ist'),cat:g('icat')};
 if(!S.tmp.pic)return perr('Item ki picture lazmi hai.');
 if(!it.name||!it.shop||!it.district||!it.city||!it.cat||!(it.price>=0))return perr('Item name, shop, district, city, aur price zaroori hain.');
 fxSave([['a_pic',['#pic']],['a_cat',['icat']],['a_shop',['is']],['a_dc',['idd','ic']],['a_p',['ip']],['a_st',['ist']]]);S.myCity=it.city;it.id=S.iid++;it.pic=S.tmp.pic;it.adm=S.cur.u;S.cur.shop=it.shop;S.items.push(it);render()}
function adminTab(){const f=S.cur.pf,t=S.tab;
 if(t==='req'&&f)return '<h2>Requests</h2><p class="msg">Abhi koi request nahi hai.</p>';
 if(t==='notif'&&f)return '<h2>Notifications</h2><p class="msg">Koi nayi notification nahi.</p>';
 if(t==='inv'&&f)return invView();
 return back()+(f?'<h2>Profile</h2>'+profCard(f,1)+locForm(f)+`<h2 style="margin-top:20px">Delivery charges</h2>${S.msg?`<p class="msg">${S.msg}</p>`:''}<div class="form"><input id="rt" type="number" min="0" placeholder="Rs per km" value="${S.cur.rate??''}"><button class="big" onclick="saveRate()">Save rate</button></div>`:adminProfile())}
function saveRate(){S.cur.rate=Math.max(0,+$('rt').value||0);render();toast('Rate save ho gaya: Rs '+S.cur.rate+' per km')}
function adminPanel(){const f=S.cur.pf;return `${back()}<h2>Admin panel</h2><div class="item"><div class="em">${f.pic?`<img src="${f.pic}" alt="" style="width:90px;height:90px;border-radius:50%;object-fit:cover">`:'👤'}</div><b>${esc(f.name)}</b><span>${esc(f.mobile)}<br>${esc(f.city)}, ${esc(f.district)}<br>${esc(f.loc||'')}<br>${esc(f.address)}</span>${f.voice?`<br><audio controls src="${f.voice}" style="width:100%;margin-top:8px"></audio>`:''}</div>`}
const isDemo=()=>S.role==='sadmin'&&S.sv==='demo';
function billSwap(){const d=isDemo();if(d&&!S.inDemo){S.cb=S.bill;S.bill=S.dbill;S.inDemo=true}else if(!d&&S.inDemo){S.dbill=S.bill;S.bill=S.cb;S.inDemo=false}}
function demoView(){const t=S.tab;return `<p class="hint" style="margin:0 0 6px;text-align:left">Bill Demo: customer ko jo kuch nazar aata hai wohi yahan dikhta hai.</p>`+(t==='bill'?billView():t==='notif'?'<h2>Notifications</h2><p class="msg">Koi nayi notification nahi.</p>':homeView())}
function render(){billSwap();dots();buildDrawer();
 const r=S.role;let h='';const t=tabs();
 if(!r){h=`<div class="btnrow"><button class="big" onclick="go('customer')">Customer</button>`+
  ROLES.map((x,i)=>S.shown[i]?`<button class="big alt pop" onclick="go('${x.k}')">${x.n}</button>`:'').join('')+`</div><p class="hint">Welcome! Customer se shuru karein.</p>`}
 else if(r==='customer'||r==='rider'){
  const k=r==='customer'?'customer':'rider';
  if(S.tab==='home')h=homeView();
  else if(S.tab==='fav')h=favView();
  else if(S.tab==='profile')h=back()+(S.msg?`<p class="msg err">${S.msg}</p>`:'')+(k==='rider'?(S.rider?'<h2>Profile</h2>'+profCard(S.rider.pf,1)+locForm(S.rider.pf):adminProfile('rider')):(S.customer?'<h2>Profile</h2>'+profCard(S.customer.pf,1)+locForm(S.customer.pf):adminProfile('customer')));
  else if(S.tab==='bill')h=billView();
  else if(S.tab==='req')h=`<h2>Requests</h2><p class="msg">Abhi koi delivery request nahi hai.</p>`;
  else h=`<h2>Notifications</h2><p class="msg">Koi nayi notification nahi.</p>`}
 else if(r==='admin')h=!S.cur?login('admin'):adminTab();
 else h=S.superOK?sa():login('sadmin');
 main.innerHTML=h;
 if(t){nav.hidden=false;nav.innerHTML=t.map(x=>`<button class="${S.tab===x[0]?'on':''}" ${x[3]?'disabled':''} onclick="S.tab='${x[0]}';S.msg='';S.editLoc=null;render()"><span class="ic">${x[1]}</span>${x[2]}</button>`).join('')}else nav.hidden=true;if(S.editLoc){const e=$(S.editLoc==='d'?'ld':'lc');e&&e.focus()}}
render();
</script></body></html>
